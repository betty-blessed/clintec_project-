<!-- LIVE CHAT -->

<div class="live-chat-container">

    <!-- CHAT BUTTON -->
   <button class="live-chat-btn" onclick="toggleChat()">
    <i class="bi bi-chat-dots-fill"></i>
    <span class="chat-text">Chat with us</span>
</button>

    <!-- CHAT BOX -->
    <div class="chat-box" id="chatBox">

        <div class="chat-header">
            Clintec Live Chat
        </div>

        <div class="chat-body" id="chatBody">

            <div class="bot-message">
                👋 Hello! Welcome to Clintec Ultrasound & X-Ray. How can we help you today?
            </div>

        </div>

        <div class="chat-footer">

            <input type="text"
                   id="userMessage"
                   placeholder="Type message..."
                   onkeypress="if(event.key==='Enter'){sendMessage()}">

            <button onclick="sendMessage()">
                Send
            </button>

        </div>

    </div>

</div>

<!-- JAVASCRIPT (IMPORTANT FIX) -->
<script>

function toggleChat() {

    let chatBox = document.getElementById("chatBox");

    if (chatBox.style.display === "flex") {
        chatBox.style.display = "none";
    } else {
        chatBox.style.display = "flex";
    }
}

function sendMessage() {

    let input = document.getElementById("userMessage");
    let message = input.value.trim();

    if (message === "") return;

    let chatBody = document.getElementById("chatBody");

    // USER MESSAGE
    let userDiv = document.createElement("div");
    userDiv.classList.add("user-message");
    userDiv.innerHTML = message;
    chatBody.appendChild(userDiv);

    input.value = "";

    // BOT RESPONSE
    setTimeout(() => {

        let botDiv = document.createElement("div");
        botDiv.classList.add("bot-message");

        botDiv.innerHTML = getBotReply(message.toLowerCase());

        chatBody.appendChild(botDiv);

        chatBody.scrollTop = chatBody.scrollHeight;

    }, 500);

    chatBody.scrollTop = chatBody.scrollHeight;
}



function getBotReply(message) {

    let msg = message.toLowerCase();

    // 1. SUNDAY CHECK (HIGHEST PRIORITY)
    if (msg.includes("sunday")) {

        // If asking about opening on Sunday specifically
        if (msg.includes("open")) {
            return "We are closed on Sundays, except for booked appointments.";
        }

        return "Sundays are only available for bookings.";
    }

    // 2. OPEN HOURS (ONLY IF NOT SUNDAY)
    if (msg.includes("open")) {
        return "We are open Monday–Saturday, 8:00 AM – 7:30 PM.";
    }

    if (msg.includes("walk")) {
        return "Yes, we accept both walk-ins and bookings.";
    }

    if (
    msg.includes("female") ||
    msg.includes("lady") ||
    msg.includes("woman") ||
    msg.includes("sonographer")
) {
    return "Yes, we have both male and female sonographers available for your comfort and preference.";
}

    if (msg.includes("consult")) {
        return "Consultation is free. Call 0708300588 for assistance.";
    }

    return "Thank you for contacting Clintec. Please call 0708300588 for assistance.";
}

</script>
